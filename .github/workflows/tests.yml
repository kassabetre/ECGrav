name: Tests

# Runs the ECGrav .wlt regression suite in the official Wolfram Engine container on every
# push to main and on every pull request, failing the job if any test regresses.
# Tests/ci-run.wls locates the package, runs both .wlt files via MUnit`TestReport, and
# exits non-zero on any failure.
#
# ---------------------------------------------------------------------------------------
# LICENSING -- REQUIRED one-time setup before this workflow can run
# ---------------------------------------------------------------------------------------
# This workflow uses option (B): the FREE Wolfram Engine for Developers, activated fresh
# each run from your Wolfram account (no node-locking, no Service Credits).
#   1. Get a free Wolfram Engine license: https://www.wolfram.com/engine/  (needs a Wolfram
#      ID; the free Engine is tied to that account).
#   2. Add two repository secrets under  Settings -> Secrets and variables -> Actions:
#          WOLFRAM_ID    = your Wolfram ID (the account email)
#          WOLFRAM_PASS  = your Wolfram ID password
#
# To switch to option (A), on-demand entitlement (officially supported, but draws Wolfram
# Service Credits per run -- including one per LaunchKernels[] kernel): drop the "Activate"
# step and the WOLFRAM_ID / WOLFRAM_PASS env below, then set
#     WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
# in env and add that one secret. Nothing else changes.
# ---------------------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wlt:
    name: .wlt regression suite
    runs-on: ubuntu-latest
    container:
      image: wolframresearch/wolframengine:latest
      options: --user root
    env:
      WOLFRAM_ID: ${{ secrets.WOLFRAM_ID }}
      WOLFRAM_PASS: ${{ secrets.WOLFRAM_PASS }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Activate the free Engine for this run; the license persists on the container
      # filesystem for the following step.
      - name: Activate the free Wolfram Engine
        run: |
          wolframscript -authenticate "$WOLFRAM_ID" "$WOLFRAM_PASS"
          wolframscript -activate

      - name: Run the .wlt regression suite
        run: wolframscript -file Tests/ci-run.wls
